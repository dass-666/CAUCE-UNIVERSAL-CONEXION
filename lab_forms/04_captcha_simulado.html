<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Laboratorio 4 · Página con verificación humana (simulada)</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<main>
  <h1>Laboratorio 4 · Página que exige intervención humana</h1>
  <p class="nota">Simula un CAPTCHA (no es uno real, no carga nada externo). El conector debe
    detectarlo y NO rellenar ni enviar: la persona debe completar esta página.</p>
  <form id="contacto">
    <div class="fila"><label for="email">Correo</label><input id="email" name="email" type="email"></div>
    <div class="g-recaptcha" data-sitekey="simulado-sin-red">[Casilla «No soy un robot» simulada]</div>
    <button type="submit">Enviar</button>
  </form>
</main>
</body>
</html>
