name: pruebas
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Copia de SOLO LECTURA del contrato de Cauce Monitor (commit fijado) para la prueba cruzada
      - uses: actions/checkout@v4
        with:
          repository: dass-666/Cauce-monitor-engine
          ref: 9e7f88dd19f3e3bbf5c0c1e4476afbd2ca3bf76a
          path: monitor-contrato
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: python -m playwright install chromium
        if: runner.os == 'Windows'
      - run: python -m pytest -q
        env:
          CAUCE_EVIDENCE_DIR: evidence/out
          MONITOR_REPO: ${{ github.workspace }}/monitor-contrato
      - run: python scripts/demo_lab.py
      - run: python scripts/ejemplo_cauce_monitor.py --no-interactivo
      - run: python scripts/recorrido_ui.py --headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-${{ matrix.os }}
          path: evidence/out
