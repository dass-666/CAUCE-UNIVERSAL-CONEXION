name: pruebas
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Copia de SOLO LECTURA del contrato de Cauce Monitor (commit fijado) para la prueba cruzada
      - uses: actions/checkout@v4
        with:
          repository: dass-666/Cauce-monitor-engine
          ref: 9e7f88dd19f3e3bbf5c0c1e4476afbd2ca3bf76a
          path: monitor-contrato
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: python -m playwright install chromium
        if: runner.os == 'Windows'
      - run: python -m pytest -q
        env:
          CAUCE_EVIDENCE_DIR: evidence/out
          MONITOR_REPO: ${{ github.workspace }}/monitor-contrato
      - run: python scripts/demo_lab.py
      - run: python scripts/ejemplo_cauce_monitor.py --no-interactivo
      - run: python scripts/recorrido_ui.py --headless
      # Analizador de formularios externos sobre un formulario de laboratorio local (solo lectura)
      - run: python -m cauce_form_connector analizar-formulario --html lab_forms/06_cita_monitor.html --expediente sample_data/expediente_monitor_sintetico.json --salida evidence/out/analisis_lab06
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-${{ matrix.os }}
          path: evidence/out

  # Instalador y analizador .bat en Windows SIN el lanzador «py» (como en equipos con Python solo como «python»)
  windows-bat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: instalar_windows.bat y analizar_formulario_windows.bat sin «py»
        shell: cmd
        run: |
          set "PATH=%pythonLocation%;%pythonLocation%\Scripts;C:\Windows\System32;C:\Windows\System32\WindowsPowerShell\v1.0"
          where py >nul 2>nul && (echo ERROR: py sigue disponible & exit /b 1)
          echo OK: el comando py no esta disponible
          call instalar_windows.bat || exit /b 1
          if not exist .venv\Scripts\python.exe (echo ERROR: no se creo .venv & exit /b 1)
          set "CAUCE_AUTORIZADO=N"
          set "CAUCE_NO_ABRIR=1"
          call analizar_formulario_windows.bat "file:///%CD:\=/%/lab_forms/06_cita_monitor.html"
          if errorlevel 1 (echo ERROR: el analisis fallo & exit /b 1)
          dir /s /b informes\vista_previa.html || exit /b 1
          dir /s /b informes\perfil_borrador.json || exit /b 1
          call analizar_formulario_windows.bat "https://tramites.ejemplo.invalid/reserva"
          if not errorlevel 3 (echo ERROR: una URL externa no autorizada debia rechazarse & exit /b 1)
          echo OK: URL externa rechazada sin abrir el navegador
          REM Recorrido Monitor -^> Forms con tablas de equivalencias (lab 06, datos sinteticos, sin ventana, sin envio)
          start "lab" /b .venv\Scripts\python.exe -m http.server 8765 --bind 127.0.0.1 --directory lab_forms
          set "CAUCE_HEADLESS=1"
          set "PYTHONIOENCODING=utf-8"
          set "CAUCE_PROFILES_DIR=%CD%\informes\perfiles_ci"
          .venv\Scripts\python.exe -m cauce_form_connector autorrellenar --formulario config\formularios\lab_cita_monitor.json --expediente sample_data\expediente_monitor_sintetico.json --puerto 8765 --aprobar-perfil rev_ci --espera-s 0 > informes\autorrellenar_lab06.txt
          set "RC=%ERRORLEVEL%"
          type informes\autorrellenar_lab06.txt
          if not "%RC%"=="7" (echo ERROR: se esperaba revision_caducada [7] y salio %RC% & exit /b 1)
          findstr /l /c:"[!!]" informes\autorrellenar_lab06.txt && (echo ERROR: hay campos incorrectos & exit /b 1)
          findstr /l /c:"[OK] Tipo de tr" informes\autorrellenar_lab06.txt || exit /b 1
          echo OK: 8 campos con tablas de equivalencias rellenados y verificados, sin envio
          mkdir evidence\out
          xcopy /e /i /y informes evidence\out\bat_windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-bat-windows
          path: evidence/out
