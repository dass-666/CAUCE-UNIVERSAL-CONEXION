[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauce-form-connector"
version = "0.2.0rc2"
description = "Conector universal de formularios: análisis, correspondencia, escritura carácter por carácter y verificación, con parada antes del envío."
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.48,<2", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9",
  "beautifulsoup4>=4.12", "lxml>=5.0", "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cauce-forms = "cauce_form_connector.cli:main"

[tool.setuptools.packages.find]
include = ["cauce_form_connector*"]

[tool.setuptools.package-data]
cauce_form_connector = ["detector.js", "web/static/*", "contrato_v1/*.json", "contrato_v1/PIN.txt", "red/PIN.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: pruebas que abren Chromium con Playwright"]
